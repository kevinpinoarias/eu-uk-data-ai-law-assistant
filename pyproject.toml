[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "eu-uk-data-ai-law-assistant"
version = "0.1.0"
description = "Bilingual (EN/ES) agentic RAG assistant for EU, Spanish and UK data-protection and AI law."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Kevin Pino Arias" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# Optional: run the open embedding model (BGE-M3) on this machine. Not needed for the tests, CI or the
# keyword search. PyTorch for a graphics card is installed from its own index, see README.
open-embeddings = ["torch>=2.7", "transformers>=4.40,<5.20", "numpy>=1.26"]  # transformers 5.20 needs a newer torch than 2.7.1
# Optional: draw the answer pipeline as a LangGraph graph (src/law_assistant/answer/graph.py).
agent = ["langgraph>=0.4"]
# Optional: the vector search backends compared in experiment R7 (the shipped search needs only NumPy).
vector-stores = ["numpy>=1.26", "faiss-cpu>=1.8", "sqlite-vec>=0.1.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # long expected strings and docstrings are fine in tests
"experiments/*" = ["E501"]  # pre-registrations and report lines are prose; wrapping them hurts reading
"scripts/*" = ["E501"]  # small tools; prose lines are fine
