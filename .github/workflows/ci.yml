name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default; a job asks for more only if it needs it.
permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Test
        run: python -m pytest

  smoke:
    name: Smoke test (demo service on a minimal install)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Only the base package: no PyTorch, no NumPy, no model, no key. The real server process is started
      # in demo mode and called over HTTP (health, page, answer, error responses).
      - name: Install the base package only
        run: python -m pip install -e .
      - name: Start the demo server and check it
        run: python scripts/smoke_test.py

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
