name: Deploy

# Started by hand only. Builds the service image from a clean checkout plus the data bundle (the chunks and saved
# vectors that Git does not hold, see scripts/make_data_bundle.py), pushes it to the GitHub container registry with
# the workflow's own short-lived token, then points the Azure Container App at it. Signing in to Azure is keyless:
# the repository proves who it is with a short-lived token (OIDC), so no password or key is stored anywhere.
# The model key is set once in the Container App itself as a secret, never here and never in the image.
#
# One-time set-up (docs/DEPLOYMENT.md): an Azure app registration with a federated credential for this repository
# on branch main, the Container App with minimum replicas 0, the repository variables AZURE_CLIENT_ID,
# AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, AZURE_RESOURCE_GROUP and AZURE_CONTAINER_APP, a release that holds
# data-bundle.zip, and the published package set to public so the app can pull it without a stored credential.
# Not yet run: it needs those accounts.

on:
  workflow_dispatch:
    inputs:
      data_release:
        description: "Tag of the release that holds data-bundle.zip"
        required: true
        default: "data-v1"

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  deploy:
    name: Build, publish and deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and unpack the data bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATA_RELEASE: ${{ inputs.data_release }}
        run: |
          gh release download "$DATA_RELEASE" --pattern data-bundle.zip --dir dist
          unzip -q dist/data-bundle.zip -d .
          test -f data/indexes/bge-m3.f32 && test -d data/chunks

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign in to Azure (keyless)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Point the app at the new image
        env:
          APP: ${{ vars.AZURE_CONTAINER_APP }}
          GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: az containerapp update --name "$APP" --resource-group "$GROUP" --image "$IMAGE:$GITHUB_SHA"

      - name: Wait for the app to answer (a cold start can take a minute)
        env:
          APP: ${{ vars.AZURE_CONTAINER_APP }}
          GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          host=$(az containerapp show --name "$APP" --resource-group "$GROUP" --query properties.configuration.ingress.fqdn -o tsv)
          for i in $(seq 1 24); do
            if curl -fsS "https://$host/health"; then echo; echo "healthy after attempt $i"; exit 0; fi
            sleep 10
          done
          echo "the app did not answer /health within four minutes" >&2
          exit 1
