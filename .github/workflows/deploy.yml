name: Deploy

# Started by hand only. Builds the service image from a clean checkout plus the data bundle (the chunks and saved
# vectors that Git does not hold, see scripts/make_data_bundle.py), pushes it to the GitHub container registry with
# the workflow's own short-lived token, then points the Azure Container App at it. Signing in to Azure is keyless:
# the repository proves who it is with a short-lived token (OIDC), so no password or key is stored anywhere.
# The model key and the access code are set once in the Container App itself as secrets, never here and never in
# the image; this file only names them.
#
# One-time set-up: scripts/azure_setup.sh (run in Azure Cloud Shell), the five repository variables it prints
# (AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, AZURE_RESOURCE_GROUP, AZURE_CONTAINER_APP), a release
# that holds data-bundle.zip, and the published package set to public after the first push so the app can pull it
# without a stored credential (docs/DEPLOYMENT.md). Not yet run: it needs those accounts.

on:
  workflow_dispatch:
    inputs:
      data_release:
        description: "Tag of the release that holds data-bundle.zip"
        required: true
        default: "data-v1"

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  deploy:
    name: Build, publish and deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # The bundle contains NOTICE, which the checkout already has: unzip must overwrite without asking (-o), or it
      # waits for an answer nobody can give and the step fails.
      - name: Fetch and unpack the data bundle
        env:
          DATA_RELEASE: ${{ inputs.data_release }}
        run: |
          mkdir -p dist
          curl -fsSL --retry 3 -o dist/data-bundle.zip "https://github.com/${GITHUB_REPOSITORY}/releases/download/${DATA_RELEASE}/data-bundle.zip"
          ls -l dist
          unzip -q -o dist/data-bundle.zip -d .
          test -f data/indexes/bge-m3.f32 && test -d data/chunks
          ls -l data/indexes

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign in to Azure (keyless)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Every deploy re-asserts the port, the replica limits and the two secret references, so an app that was set
      # up carelessly by hand is corrected, and a deploy to an app without those secrets fails instead of going
      # live open.
      - name: Point the app at the new image
        env:
          APP: ${{ vars.AZURE_CONTAINER_APP }}
          GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          az containerapp ingress update --name "$APP" --resource-group "$GROUP" --target-port 8000
          az containerapp update --name "$APP" --resource-group "$GROUP" \
            --image "$IMAGE:$GITHUB_SHA" \
            --min-replicas 0 --max-replicas 1 \
            --set-env-vars GEMINI_API_KEY=secretref:gemini-key ACCESS_CODE=secretref:access-code

      - name: Wait for the app to answer (a cold start can take a minute)
        env:
          APP: ${{ vars.AZURE_CONTAINER_APP }}
          GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          host=$(az containerapp show --name "$APP" --resource-group "$GROUP" --query properties.configuration.ingress.fqdn -o tsv)
          for i in $(seq 1 24); do
            if curl -fsS "https://$host/health"; then echo; echo "healthy after attempt $i"; exit 0; fi
            sleep 10
          done
          echo "the app did not answer /health within four minutes" >&2
          exit 1
